name: Discord server stats
on:
  schedule:
    # Every 10 minutes. Offset from :00 to reduce scheduling congestion.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discord-server-stats
  cancel-in-progress: false
jobs:
  update:
    # Leave disabled until a guild is configured.
    if: ${{ vars.DISCORD_STATS_GUILD_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Update Discord counters
        env:
          DISCORD_STATS_BOT_TOKEN: ${{ secrets.DISCORD_STATS_BOT_TOKEN }}
          DISCORD_STATS_GUILD_ID: ${{ vars.DISCORD_STATS_GUILD_ID }}
          DISCORD_STATS_CATEGORY_ID: ${{ vars.DISCORD_STATS_CATEGORY_ID }}
        run: node scripts/server-stats.mjs
